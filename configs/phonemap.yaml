# Map from the phone recognizer's espeak-IPA tokens (facebook/wav2vec2-xlsr-53-espeak-cv-ft,
# 392 multilingual tokens) to the Switchboard/ISIP 42-phone set used for training.
# Values are lists (an IPA symbol may be several phones: diphthongs/affricates/r-coloured vowels);
# an empty list means "no counterpart: drop". Anything not listed is normalised
# (length/tone/diacritics stripped, see src/phones/ipa.py) and looked up again; if still
# unknown it is dropped and counted, so the mapping is total.

map:
  # --- vowels
  i: [iy]
  iː: [iy]
  ɪ: [ih]
  ᵻ: [ih]
  e: [ey]
  eː: [ey]
  ɛ: [eh]
  æ: [ae]
  a: [aa]
  aː: [aa]
  ɑ: [aa]
  ɑː: [aa]
  ɒ: [aa]
  ɔ: [ao]
  ɔː: [ao]
  o: [ow]
  oː: [ow]
  ʊ: [uh]
  u: [uw]
  uː: [uw]
  ʌ: [ah]
  ɐ: [ax]
  ə: [ax]
  ɜ: [er]
  ɜː: [er]
  ɚ: [er]
  ɨ: [ih]
  ʉ: [uw]
  y: [uw]
  ø: [er]
  œ: [er]
  # --- diphthongs and r-coloured vowels
  aɪ: [ay]
  aʊ: [aw]
  eɪ: [ey]
  oʊ: [ow]
  əʊ: [ow]
  ɔɪ: [oy]
  ɑːɹ: [aa, r]
  ɔːɹ: [ao, r]
  oːɹ: [ow, r]
  ɛɹ: [eh, r]
  ɪɹ: [ih, r]
  ʊɹ: [uh, r]
  əl: [el]
  l̩: [el]
  n̩: [en]
  iə: [iy, ax]
  aɪɚ: [ay, er]
  aɪə: [ay, ax]
  # --- consonants
  p: [p]
  b: [b]
  t: [t]
  d: [d]
  k: [k]
  ɡ: [g]
  g: [g]
  ʔ: []            # glottal stop: not a phone in the lexicon
  ɾ: [d]           # flap (water, butter)
  f: [f]
  v: [v]
  ʋ: [v]
  θ: [th]
  ð: [dh]
  s: [s]
  z: [z]
  ʃ: [sh]
  ʒ: [zh]
  h: [hh]
  x: [hh]
  ç: [hh]
  tʃ: [ch]
  dʒ: [jh]
  ts: [t, s]
  m: [m]
  n: [n]
  ŋ: [ng]
  ɲ: [n]
  l: [l]
  ɫ: [l]
  ɭ: [l]
  ɹ: [r]
  r: [r]
  ɻ: [r]
  ʁ: [r]
  w: [w]
  j: [y]
  ɣ: [g]
  β: [b]
  ɕ: [sh]
  ʎ: [l]
  # --- nasalised vowels
  ɑ̃: [aa]
  ɔ̃: [ao]
  ɛ̃: [eh]
  œ̃: [er]
