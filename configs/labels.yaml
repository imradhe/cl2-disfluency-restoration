# Disfluency tag set and lexical resources used by src/swb/label.py.
# "gold"  = explicitly marked in the ISIP transcripts.
# "silver" = derived by rule; precision is spot-checked (see report).

tags:
  - O                    # fluent word (kept in the skeleton)
  - FILLER_HESITATION
  - FILLER_BACKCHANNEL
  - FILLER_DM            # discourse marker used as a filler
  - REPETITION
  - REPAIR
  - FALSE_START
  - PARTIAL_WORD
  - PROLONGATION
  - MISPRONUNCIATION
  - NOISE

# --- gold lexical fillers (ISIP guidelines) --------------------------------
hesitation_gold: [uh, um, ah, hm, huh]
backchannel_gold: [uh-huh, um-hum, huh-uh, hum-um]

# --- silver lexical fillers --------------------------------------------------
# Extra hesitations requested for the project; most are not marked in ISIP
# (clicks/ugh/ooh are usually [vocalized-noise]/[noise]) so they only fire when present.
hesitation_silver: [eh, er, hmm, mm, umm, uhh, ehh, ugh, ooh, ohh, ho, uh-oh, uhh-oh, tsk]
# "oh" is ambiguous (interjection vs hesitation): tagged silver, checked in spot-check.
hesitation_ambiguous: [oh]

# Words that are backchannels when they form (nearly) the whole utterance.
backchannel_words: [yeah, yep, yes, nope, right, sure, okay, exactly, really]
backchannel_max_tokens: 3

# Discourse markers: tagged FILLER_DM only in parenthetical / non-argument position.
discourse_markers_multi: [["you", "know"], ["i", "mean"], ["you", "see"], ["sort", "of"], ["kind", "of"]]
discourse_markers_single: [well, like, so, actually, basically, anyway]
# Single-word DMs are only tagged when utterance-initial (after a turn change or
# long pause) or immediately followed/preceded by another filler.
dm_pause_threshold_s: 0.25

# --- repetition / repair / false-start rules -------------------------------
repetition:
  max_ngram: 4
  allow_interleaved_fillers: true     # "the uh the"
  # deliberate reduplication that is not a disfluency
  intentional: [[bye, bye], [night, night], [so, so], [boom, boom]]
repair:
  max_gap_tokens: 3                   # tokens allowed between reparandum and repair
  min_copy_overlap: 0.5               # fraction of repair tokens that must copy reparandum
  editing_terms: [no, i-mean, well, sorry, rather, or]
false_start:
  require_truncation_cue: true        # partial word or unfinished clause before restart

# --- prolongation (duration based, silver) ---------------------------------
prolongation:
  zscore_threshold: 2.0               # vs. lexicon-expected duration for the word
  min_duration_s: 0.35
  function_words_only: true
  exclude_phrase_final: true          # skip words followed by a pause > pause_s
  pause_s: 0.25

# --- tokens ignored when building the skeleton ------------------------------
noise_markers: ["[laughter]", "[noise]", "[vocalized-noise]", "[silence]"]
