[project]
name = "disfluency-restoration"
version = "0.2.0"
description = "Transcript-only Switchboard disfluency restoration with text embeddings, linguistic features and grouped ablations."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "tqdm",
    "torch",
    "transformers",
    "scikit-learn",
    "jiwer",
    "pytest",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]
syntax = ["spacy"]
stats = ["matplotlib", "scipy"]

[project.scripts]
disfluency-restoration = "disfluency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
